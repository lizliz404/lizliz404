<svg width="720" height="96" viewBox="0 0 720 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Liz animated intro</title>
  <desc id="desc">A simple animated text intro for Liz's GitHub profile.</desc>
  <style>
    .line {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      fill: #111111;
      letter-spacing: -0.02em;
    }
    .small {
      font-size: 18px;
      font-weight: 500;
      fill: #555555;
      letter-spacing: 0;
    }
    .big {
      font-size: 34px;
      font-weight: 700;
    }
    .cursor {
      fill: #111111;
      animation: blink 1s steps(1, end) infinite;
    }
    .fade-1 {
      opacity: 0;
      animation: fadeIn 700ms ease-out 120ms forwards;
    }
    .type {
      stroke: #111111;
      stroke-width: 0;
      clip-path: inset(0 100% 0 0);
      animation: reveal 2.2s steps(34, end) 650ms forwards;
    }
    .fade-2 {
      opacity: 0;
      animation: fadeIn 800ms ease-out 2.7s forwards;
    }
    @keyframes reveal {
      to { clip-path: inset(0 0 0 0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @media (prefers-color-scheme: dark) {
      .line, .cursor { fill: #f3f4f6; }
      .small { fill: #a1a1aa; }
    }
  </style>

  <text x="360" y="28" text-anchor="middle" class="line small fade-1">Hi, I'm Liz.</text>
  <g class="type">
    <text x="360" y="61" text-anchor="middle" class="line big">AI coding / products / growth</text>
  </g>
  <rect x="623" y="34" width="3" height="34" rx="1.5" class="cursor" />
  <text x="360" y="86" text-anchor="middle" class="line small fade-2">shipping things, not just ideas</text>
</svg>
